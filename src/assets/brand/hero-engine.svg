<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">PocketX business engine  Telegram to Sheets ops flow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#123A66"/>
    </linearGradient>
    <linearGradient id="phone" x1="220" y1="60" x2="420" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="640" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="520" cy="80" r="90" fill="#0D9488" fill-opacity="0.18"/>
  <circle cx="90" cy="340" r="110" fill="#F59E0B" fill-opacity="0.12"/>

  <!-- grid accents -->
  <g stroke="#FFFFFF" stroke-opacity="0.08">
    <path d="M40 120h160M40 150h120M40 180h140"/>
    <path d="M460 260h140M480 290h120M500 320h100"/>
  </g>

  <!-- phone -->
  <g filter="url(#soft)">
    <rect x="230" y="48" width="180" height="324" rx="28" fill="url(#phone)"/>
    <rect x="242" y="70" width="156" height="268" rx="16" fill="#0B1F3A"/>
    <rect x="298" y="56" width="44" height="6" rx="3" fill="#CBD5E1"/>

    <!-- chat bubbles -->
    <rect x="258" y="96" width="100" height="36" rx="12" fill="#0D9488"/>
    <rect x="278" y="146" width="104" height="36" rx="12" fill="#1E3A5F"/>
    <rect x="258" y="196" width="92" height="36" rx="12" fill="#0D9488"/>
    <path d="M270 258h70" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="360" cy="258" r="10" fill="#F59E0B"/>
    <path d="M356 258l3 3 6-7" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- floating sheets card -->
  <g filter="url(#soft)">
    <rect x="430" y="120" width="150" height="110" rx="16" fill="#FFFFFF"/>
    <rect x="448" y="140" width="50" height="8" rx="4" fill="#0B1F3A"/>
    <rect x="448" y="160" width="114" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="448" y="176" width="96" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="448" y="192" width="108" height="6" rx="3" fill="#94A3B8"/>
    <rect x="448" y="208" width="40" height="6" rx="3" fill="#0D9488"/>
  </g>

  <!-- engine badge -->
  <g filter="url(#soft)">
    <rect x="56" y="128" width="150" height="150" rx="24" fill="#FFFFFF"/>
    <circle cx="131" cy="188" r="38" stroke="#0B1F3A" stroke-width="10" fill="none"/>
    <circle cx="131" cy="188" r="14" fill="#F59E0B"/>
    <path d="M131 140v18M131 218v18M83 188h18M161 188h18M98 155l12 12M152 209l12 12M98 221l12-12M152 167l12-12" stroke="#0B1F3A" stroke-width="6" stroke-linecap="round"/>
    <text x="131" y="255" text-anchor="middle" fill="#0B1F3A" font-family="Georgia, serif" font-size="14" font-weight="700">ENGINE</text>
  </g>

  <!-- flow arrows -->
  <path d="M206 190h20" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <path d="M410 200h18" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
</svg>
